<style>
/* Layout: full-bleed 3D room; star tray top-center, big round buttons top corners, speech bubble bottom, story cards over the room */
:root{
  --sky:#f7e8ef; --sky2:#ece4f7;
  --cream:#fffaf6; --ink:#5a3f52; --muted:#9a7f8f;
  --pink:#ef86a6; --pink-deep:#d9668b; --pink-soft:#fde3eb; --line:#f2d4de;
  --gold:#f7c34f; --gold-deep:#e2a12b; --lav:#c9b4ea;
  --display:"Baloo Bhaijaan 2", "Segoe UI", Tahoma, system-ui, sans-serif;
  color-scheme: light;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:radial-gradient(120% 90% at 50% 0%,var(--sky) 0%,var(--sky2) 72%);color:var(--ink);font-family:var(--display);direction:rtl;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.top{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
  padding-block:12px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));pointer-events:none}
.top>*{pointer-events:auto}
.btns{display:flex;gap:8px}
.rb{width:56px;height:56px;border-radius:50%;border:3px solid #fff;background:var(--cream);color:var(--ink);display:grid;place-items:center;cursor:pointer;
  box-shadow:0 8px 20px -10px rgba(140,70,110,.6),inset 0 -4px 0 rgba(239,134,166,.18);transition:transform .15s}
.rb:active{transform:scale(.92)}
.rb svg{width:28px;height:28px}
.rb.hint{background:var(--gold);color:#6b4510}
.rb:focus-visible,.big:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
.tray{display:flex;gap:6px;background:var(--cream);border:3px solid #fff;border-radius:999px;padding:6px 12px;box-shadow:0 10px 24px -12px rgba(140,70,110,.6)}
.slot{width:40px;height:40px;display:grid;place-items:center}
.slot svg{width:36px;height:36px;transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.slot svg path{fill:#efe2ea;stroke:#e2cbd6;stroke-width:1.5}
.slot.on svg{transform:scale(1.18) rotate(-8deg)}
.slot.on svg path{fill:var(--gold);stroke:var(--gold-deep)}
.bubble{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 28px));
  background:var(--cream);border:3px solid #fff;border-radius:26px;padding:12px 18px 10px;display:flex;align-items:center;gap:12px;
  box-shadow:0 14px 30px -14px rgba(140,70,110,.7);transition:opacity .3s}
.bubble .face{flex:none;width:52px;height:52px}
.bubble p{margin:0;font-size:clamp(19px,4.8vw,26px);font-weight:700;line-height:1.35;text-wrap:balance;min-width:0}
.bubble.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:translateX(-50%) scale(.94)}to{transform:translateX(-50%) scale(1)}}
.card{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(460px,calc(100% - 28px));
  background:var(--cream);border:4px solid #fff;border-radius:34px;padding:20px 22px 22px;text-align:center;box-shadow:0 22px 50px -18px rgba(140,70,110,.75)}
.card .kicker{font-size:15px;font-weight:600;color:var(--pink-deep);letter-spacing:.02em}
.card h1{margin:2px 0 6px;font-size:clamp(28px,7.5vw,40px);font-weight:800;line-height:1.15;text-wrap:balance}
.card p{margin:0 0 16px;font-size:clamp(18px,4.6vw,22px);font-weight:600;color:var(--ink);text-wrap:balance}
.big{font:inherit;font-size:clamp(22px,6vw,28px);font-weight:800;color:#fff;background:linear-gradient(180deg,#f59bb7,var(--pink-deep));border:4px solid #fff;border-radius:999px;
  padding:12px 34px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:10px;box-shadow:0 10px 0 -2px #c4507a,0 18px 30px -12px rgba(200,60,110,.7);animation:breathe 1.8s ease-in-out infinite}
.big svg{width:26px;height:26px}
.big:active{transform:translateY(4px);box-shadow:0 5px 0 -2px #c4507a}
@keyframes breathe{50%{transform:scale(1.05)}}
.toast{position:absolute;top:84px;left:50%;transform:translateX(-50%);background:var(--gold);color:#5b3a08;font-weight:800;font-size:22px;padding:8px 22px 5px;border-radius:999px;border:3px solid #fff;
  box-shadow:0 12px 26px -12px rgba(160,100,10,.7);pointer-events:none}
@media (max-width:420px){.rb{width:48px;height:48px}.rb svg{width:24px;height:24px}.slot{width:32px;height:32px}.slot svg{width:30px;height:30px}.tray{padding:5px 9px}}
@media (prefers-reduced-motion:reduce){.big{animation:none}.bubble.pop{animation:none}}
</style>

</head>

<div id="app">
  <canvas id="c" aria-label="غرفة روز ثلاثية الأبعاد — اضغطي على الأغراض" tabindex="0"></canvas>
  <div class="top">
    <div class="btns">
      <button class="rb" id="btnSound" aria-label="الصوت" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path id="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path id="mute" d="M16 9l6 6M22 9l-6 6" hidden/></svg>
      </button>
      <button class="rb" id="btnCam" aria-label="رجّعي الكاميرا">

      <button class="rb hint" id="btnHint" aria-label="مساعدة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z" fill="currentColor" fill-opacity=".25"/></svg>

    <svg class="face" viewBox="0 0 52 52" aria-hidden="true"><path d="M9 26c-2 8 0 16 2 20M43 26c2 8 0 16-2 20" stroke="#2b1c19" stroke-width="6" stroke-linecap="round" fill="none"/><circle cx="11" cy="46" r="2.5" fill="#f06a9b"/><circle cx="41" cy="46" r="2.5" fill="#f06a9b"/><circle cx="26" cy="25" r="19" fill="#2b1c19"/><circle cx="26" cy="28" r="16" fill="#ffdac6"/><path d="M10 26c0-12 32-14 32 0-4-6-8-9-16-9s-12 3-16 9z" fill="#2b1c19"/><ellipse cx="20" cy="29" rx="3.6" ry="4.4" fill="#9a5a22"/><ellipse cx="32" cy="29" rx="3.6" ry="4.4" fill="#9a5a22"/><circle cx="19" cy="27.5" r="1.3" fill="#fff"/><circle cx="31" cy="27.5" r="1.3" fill="#fff"/><circle cx="15" cy="34" r="2.6" fill="#f7a3b4" opacity=".7"/><circle cx="37" cy="34" r="2.6" fill="#f7a3b4" opacity=".7"/><path d="M22 35h8q-4 6-8 0z" fill="#a8344a"/></svg>
    <p id="say"></p>
  </div>
  <section class="card" id="intro">
    <div class="kicker">البحث عن الكنز</div>
    <h1>مرحباً روز!</h1>
    <p>هل أنتِ مستعدة للبحث عن الكنز؟</p>
    <button class="big" id="btnStart"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 5L7 12l10 7z"/></svg>ابدئي المغامرة</button>
  </section>
  <section class="card" id="outro" hidden>
    <div class="kicker">وجدتِ الكنز</div>
    <h1>أحسنتِ يا روز!</h1>
    <p>جمعتِ كل النجوم وفتحتِ صندوق الكنز</p>
    <button class="big" id="btnAgain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>العبي مرة ثانية</button>
  </section>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>

<script>
(function(){
/* ===== Room dimensions (approx, metres). x = east (Wall1 at x=0 → Wall3 at x=W), z = south (Wall2 at z=0 → Wall4 at z=D) ===== */
const W=4.4, D=4.0, H=2.7, T=0.16;

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
THREE.ColorManagement.legacyMode=false; renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.25;
renderer.localClippingEnabled=true;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,0.05,100);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.minDistance=1.5; controls.maxDistance=30;
const cutPlane=new THREE.Plane(new THREE.Vector3(0,-1,0),1.15);

/* ---------- helpers ---------- */
let seed=7; const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const mat=(color,o={})=>new THREE.MeshStandardMaterial(Object.assign({color,roughness:.62,metalness:0},o));
const geoCache={};
function rgeo(w,h,d,r){
  r=Math.max(0.002,Math.min(r,w/2-0.003,h/2-0.003,d/2-0.003));
  const key=[w,h,d,r].map(v=>v.toFixed(3)).join('|'); if(geoCache[key]) return geoCache[key];
  const x=w/2-r,y=h/2-r,c=Math.min(r*0.9,x*0.9,y*0.9),s=new THREE.Shape();
  s.moveTo(-x+c,-y);s.lineTo(x-c,-y);s.quadraticCurveTo(x,-y,x,-y+c);s.lineTo(x,y-c);s.quadraticCurveTo(x,y,x-c,y);
  s.lineTo(-x+c,y);s.quadraticCurveTo(-x,y,-x,y-c);s.lineTo(-x,-y+c);s.quadraticCurveTo(-x,-y,-x+c,-y);
  const dd=Math.max(0.0005,d-2*r);
  const g=new THREE.ExtrudeGeometry(s,{depth:dd,bevelEnabled:true,bevelThickness:r,bevelSize:r,bevelSegments:3,curveSegments:3});
  g.translate(0,0,-dd/2); return geoCache[key]=g;
}
function M(geo,m,x,y,z,p){const me=new THREE.Mesh(geo,m);me.position.set(x,y,z);me.castShadow=true;me.receiveShadow=true;(p||scene).add(me);return me;}
const RB=(w,h,d,r,m,x,y,z,p)=>M(rgeo(w,h,d,r),m,x,y,z,p);
const BX=(w,h,d,m,x,y,z,p)=>M(new THREE.BoxGeometry(w,h,d),m,x,y,z,p);
const SP=(r,m,x,y,z,p)=>M(new THREE.SphereGeometry(r,20,14),m,x,y,z,p);
const CY=(rt,rb,h,m,x,y,z,p,seg=20)=>M(new THREE.CylinderGeometry(rt,rb,h,seg),m,x,y,z,p);
function tex(w,h,draw,srgb=true){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);const t=new THREE.CanvasTexture(c);if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t;}
function flower(c,x,y,r,col,cen){c.fillStyle=col;for(let i=0;i<5;i++){const a=i*Math.PI*2/5-Math.PI/2;c.beginPath();c.arc(x+Math.cos(a)*r*.55,y+Math.sin(a)*r*.55,r*.46,0,7);c.fill();}c.fillStyle=cen;c.beginPath();c.arc(x,y,r*.3,0,7);c.fill();}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

/* ---------- palette ---------- */
const C={wall:0xe9cfa7, ceil:0xf9f1ee, white:0xfbf9f6, white2:0xf3efea, pine:0xe7b46b, pineD:0xd39a50, pink:0xf06c9f, pinkD:0xd8357b,
  lav:0xcdbbe6, door:0x8b8f99, doorD:0x6c7079, base:0x7f7d82, cap:0x5f5768, brass:0xd8b273, steel:0xc9ccd4};

/* ---------- textures ---------- */
const floorTex=tex(1024,1024,(c,w,h)=>{const rows=8,rh=h/rows;for(let r=0;r<rows;r++){let x=-(r%3)*140;while(x<w){const pw=260+rnd()*220,l=43+rnd()*7;c.fillStyle=`hsl(25,5%,${l}%)`;c.fillRect(x,r*rh,pw,rh);
  for(let k=0;k<5;k++){c.strokeStyle=`hsla(25,6%,${l-12}%,.35)`;c.lineWidth=2;c.beginPath();const yy=r*rh+8+rnd()*(rh-16);c.moveTo(x,yy);c.bezierCurveTo(x+pw*.3,yy+5,x+pw*.6,yy-5,x+pw,yy+2);c.stroke();}
  c.fillStyle='rgba(90,70,85,.35)';c.fillRect(x,r*rh,3,rh);x+=pw;}c.fillStyle='rgba(90,70,85,.4)';c.fillRect(0,r*rh,w,3);}});
floorTex.wrapS=floorTex.wrapT=THREE.RepeatWrapping; floorTex.repeat.set(W/2.4,D/2.4);
const decalTex=tex(1400,620,(c,w,h)=>{for(let i=0;i<46;i++){const x=40+rnd()*(w-80),y=40+rnd()*(h-80),s=10+rnd()*7,a=(rnd()-.5)*1.2;
  c.save();c.translate(x,y);c.rotate(a);c.strokeStyle='#a9b39a';c.lineWidth=2.5;c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(4,s*1.4,-2,s*2.6);c.stroke();
  c.fillStyle='#b8c2a6';c.beginPath();c.ellipse(5,s*1.5,s*.45,s*.2,.6,0,7);c.fill();
  if(rnd()<.82)flower(c,0,0,s,['#e9a9b6','#efb9c4','#dc98a8'][i%3],'#f8e1c9');else{c.fillStyle='#fdfdfd';c.beginPath();c.ellipse(0,0,s*.5,s*.9,.4,0,7);c.fill();}c.restore();}});
const rugTex=tex(512,768,(c,w,h)=>{rrect(c,6,6,w-12,h-12,70);c.fillStyle='#fbebe2';c.fill();c.setLineDash([10,10]);c.lineWidth=4;c.strokeStyle='#f3cfc6';rrect(c,30,30,w-60,h-60,52);c.stroke();
  for(let i=0;i<900;i++){c.fillStyle='rgba(240,205,195,.25)';c.beginPath();c.arc(20+rnd()*(w-40),20+rnd()*(h-40),3+rnd()*5,0,7);c.fill();}
  [[130,150,46],[390,180,52],[250,330,58],[120,470,48],[390,460,40],[150,640,38],[380,620,50]].forEach(([x,y,r])=>flower(c,x,y,r,'#f39cb2','#fff1e3'));});
const deskTex=tex(512,256,(c,w,h)=>{c.fillStyle='#9bd46f';c.fillRect(0,0,w,h);for(let i=0;i<26;i++)flower(c,rnd()*w,rnd()*h,9+rnd()*8,i%2?'#ff7fb0':'#ffe36b','#ffffff');});
const scaleTex=tex(128,1280,(c,w,h)=>{c.fillStyle='#fffdfb';c.fillRect(0,0,w,h);c.fillStyle='#6a5566';c.font='bold 26px sans-serif';c.textAlign='left';
  for(let cm=80;cm<=200;cm++){const y=h-(cm-80)/120*(h-20)-10,big=cm%10===0,mid=cm%5===0;c.fillRect(6,y-1,big?44:mid?28:16,2);if(big)c.fillText(String(cm),56,y+9);}});
const roseTex=tex(256,340,(c,w,h)=>{c.fillStyle='#fffafc';c.fillRect(0,0,w,h);c.fillStyle='#e0628a';c.font='italic bold 78px Georgia, serif';c.textAlign='center';c.fillText('Rose',w/2,110);
  c.save();c.translate(w/2,205);c.fillStyle='#ef7fa2';[[-1,-1],[1,-1]].forEach(([s])=>{c.beginPath();c.ellipse(s*36,-18,34,28,s*.5,0,7);c.fill();c.beginPath();c.ellipse(s*26,26,22,20,-s*.4,0,7);c.fill();});
  c.fillStyle='#8a4a66';c.fillRect(-4,-40,8,80);c.restore();c.fillStyle='#c98aa3';c.fillRect(70,285,116,4);});
const skyTex=tex(512,512,(c,w,h)=>{const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#2c3346');g.addColorStop(1,'#454a58');c.fillStyle=g;c.fillRect(0,0,w,h);
  c.fillStyle='rgba(255,250,235,.85)';for(let i=0;i<30;i++){c.beginPath();c.arc(rnd()*w,rnd()*h*.6,1+rnd()*2,0,7);c.fill();}
  [['#3a4050',400],['#343a49',450]].forEach(([col,y0])=>{c.fillStyle=col;for(let x=-40;x<w+60;x+=70){c.beginPath();c.arc(x+rnd()*20,y0+rnd()*20,60+rnd()*25,0,7);c.fill();}});});
const laceTex=tex(256,256,(c,w,h)=>{c.fillStyle='#ece2da';c.fillRect(0,0,w,h);c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=3;
  for(let i=0;i<4;i++){const x=(i%2)*128+64,y=Math.floor(i/2)*128+64;c.beginPath();c.arc(x,y,30,0,Math.PI*1.5);c.stroke();c.beginPath();c.arc(x+18,y-10,14,Math.PI,Math.PI*2.6);c.stroke();}});
laceTex.wrapS=laceTex.wrapT=THREE.RepeatWrapping; laceTex.repeat.set(1,6);
const duvetTex=(bg,fl)=>tex(512,512,(c,w,h)=>{c.fillStyle=bg;c.fillRect(0,0,w,h);for(let i=0;i<70;i++){const x=rnd()*w,y=rnd()*h;c.strokeStyle='#c7cfb4';c.lineWidth=2;c.beginPath();c.moveTo(x,y);c.lineTo(x+6,y+14);c.stroke();flower(c,x,y,7+rnd()*5,fl,'#fff5e6');}});
const glowTex=tex(64,64,(c,w,h)=>{const g=c.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.4,'rgba(255,230,240,.5)');g.addColorStop(1,'rgba(255,220,235,0)');c.fillStyle=g;c.fillRect(0,0,w,h);});

/* ---------- groups ---------- */
const G={1:new THREE.Group(),2:new THREE.Group(),3:new THREE.Group(),4:new THREE.Group()};
Object.values(G).forEach(g=>scene.add(g));
const free=new THREE.Group(); scene.add(free);

/* ---------- floor & ceiling ---------- */
const floor=M(new THREE.PlaneGeometry(W,D),mat(0xffffff,{map:floorTex,roughness:.8}),W/2,0,D/2,free); floor.rotation.x=-Math.PI/2; floor.castShadow=false;
BX(W+2*T,0.12,D+2*T,mat(C.cap),W/2,-0.061,D/2,free).castShadow=false;
const ceiling=BX(W+2*T,0.08,D+2*T,mat(C.ceil,{roughness:.9}),W/2,H+0.04,D/2,scene); ceiling.castShadow=false;

        else if(it.anim==='shake'){m.position.x=p0.x+Math.sin(f.t*38)*0.012*decay;m.position.z=p0.z+Math.cos(f.t*31)*0.008*decay;}
        else if(it.anim==='sway'){m.position.x=p0.x+Math.sin(f.t*9+p0.x*8)*0.025*decay;}});
      if(k1>=1){delete fx[k];it.meshes.forEach(m=>m.position.copy(m.userData.p0));}}
    if(hintGlow.key===k&&now<hintGlow.until){glow=Math.max(glow,(0.5+0.5*Math.sin(now*0.008))*0.6);col=0xffd36b;}
    if(glow>0||it._g){setEmissive(it,col,glow);it._g=glow>0;}});}

/* ---------- 7. voice (Arabic speech) + tiny sound effects ---------- */
let soundOn=true,arVoice=null,actx=null;
function pickVoice(){const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];arVoice=vs.find(v=>/^ar[-_]?(SA|JO|AE|EG)?/i.test(v.lang)&&/female|laila|zeina|hoda|salma|amira/i.test(v.name))||vs.find(v=>/^ar/i.test(v.lang))||null;}
if(window.speechSynthesis){pickVoice();speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',pickVoice);}
const bubble=document.getElementById('bubble'),sayEl=document.getElementById('say');
function say(text){bubble.hidden=false;sayEl.textContent=text;bubble.classList.remove('pop');void bubble.offsetWidth;bubble.classList.add('pop');
  if(!soundOn||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=arVoice?arVoice.lang:'ar-SA';if(arVoice)u.voice=arVoice;u.rate=0.88;u.pitch=1.2;speechSynthesis.speak(u);}catch(e){}}
function tones(list,type='triangle',vol=0.12){if(!soundOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
  list.forEach(([f,at,dur])=>{const o=actx.createOscillator(),g=actx.createGain(),t0=actx.currentTime+at;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+0.02);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+dur+0.05);});}catch(e){}}
const SFX={tap:()=>tones([[740,0,.18]]),nope:()=>tones([[523,0,.18],[440,.12,.25]]),
  clue:()=>tones([[523,0,.25],[659,.1,.25],[784,.2,.25],[1047,.3,.5]]),
  win:()=>tones([[523,0,.3],[659,.15,.3],[784,.3,.3],[1047,.45,.6],[784,.75,.2],[1047,.9,.9],[1319,1.05,1.2]],'triangle',0.14)};
const toast=document.getElementById('toast');let toastT=0;
function showToast(t){toast.textContent=t;toast.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>toast.hidden=true,1800);}

/* ---------- 8. camera ---------- */
let camTween=null;
function startPose(){const a=camera.aspect,fov=45,t=Math.tan(fov*Math.PI/360),tgt=new THREE.Vector3(W/2-0.1,0.55,D/2),dir=new THREE.Vector3(1,1.3,1.35).normalize();
  const d=Math.min(10.5,2.9/(t*Math.min(1,a*1.1)));return{pos:tgt.clone().addScaledVector(dir,d),tgt,fov};}
function chestPose(){const tgt=CHEST_POS.clone().setY(0.35),dir=new THREE.Vector3(0.8,0.9,1.3).normalize(),t=Math.tan(45*Math.PI/360),d=Math.min(8,1.5/(t*Math.min(1,camera.aspect)));return{pos:tgt.clone().addScaledVector(dir,d),tgt,fov:45};}
function flyTo(p,instant){if(instant){camera.position.copy(p.pos);controls.target.copy(p.tgt);camera.fov=p.fov;camera.updateProjectionMatrix();camTween=null;return;}
  camTween={t0:performance.now(),from:{pos:camera.position.clone(),tgt:controls.target.clone(),fov:camera.fov},to:p};}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

/* ---------- 9. game state ---------- */
const STAR_SVG='<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" stroke-linejoin="round"/></svg>';
const tray=document.getElementById('tray');
let state='intro',clues=[],found=[],lastAct=0,pending=[];
function later(fn,ms){const id=setTimeout(fn,ms);pending.push(id);}
function clearLater(){pending.forEach(clearTimeout);pending=[];}
function renderTray(){tray.innerHTML=clues.map((_,i)=>`<div class="slot${i<found.length?' on':''}">${STAR_SVG}</div>`).join('');}
function newGame(){clearLater();const p=POOL.slice();for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]];}
  clues=p.slice(0,3);found=[];renderTray();chest.visible=false;confetti.visible=false;chest.userData.open=0;lid.rotation.x=0;chest.userData.glow.intensity=0;chest.userData.halo.material.opacity=0;roseReset();}
const nextClue=()=>clues.find(k=>!found.includes(k));
function giveHint(){const k=nextClue();if(!k||state!=='play')return;say(ITEMS[k].hint);hintGlow.key=k;hintGlow.until=performance.now()+5000;lastAct=performance.now();}
const CHEER=['ليس هنا… جرّبي مكاناً آخر!','قريب! ابحثي في مكان ثاني','أنتِ شاطرة! حاولي مرة ثانية'];let cheerI=0;
const COUNT=['وجدتِ النجمة الأولى!','وجدتِ النجمة الثانية!','وجدتِ النجمة الثالثة!'];

function tapItem(k,point){const it=ITEMS[k];lastAct=performance.now();flash(k);SFX.tap();
  const look=it.center.clone();const wt=walkTo(k==='rug'?point:look,look);
  if(state!=='play'){say(it.say);return;}
  if(hintGlow.key===k)hintGlow.until=0;
  say(it.say);
  const isClue=clues.includes(k),already=found.includes(k);
  if(isClue&&!already){found.push(k);const delay=Math.max(900,wt*1000+250);
    later(()=>{const top=it.center.clone();top.y=Math.min(it.box.max.y+0.25,2.4);popStar(top);SFX.clue();renderTray();roseWave=1.2;
      showToast(COUNT[found.length-1]);
      if(found.length<clues.length){say(COUNT[found.length-1]+' بقي '+(clues.length-found.length===1?'نجمة واحدة':'نجمتان'));later(giveHint,3200);}
      else{say('رائع! جمعتِ كل النجوم!');later(reveal,2300);}},delay);}
  else if(already&&isClue){later(()=>say('وجدنا النجمة هنا من قبل!'),1600);}
  else if(POOL.includes(k)){later(()=>{SFX.nope();say(CHEER[cheerI++%CHEER.length]);},Math.max(1700,wt*1000));}}

function reveal(){state='reveal';hintGlow.until=0;say('انظري! صندوق الكنز يظهر');flyTo(chestPose());
  chest.visible=true;chest.userData.rise=0;chest.position.set(CHEST_POS.x,-0.45,CHEST_POS.z);
  walkTo(new THREE.Vector3(CHEST_POS.x-0.62,0,CHEST_POS.z+0.02),null);
  later(()=>{chest.userData.open=0.001;burst();SFX.win();roseJump=3;say('أحسنتِ يا روز! لقد وجدتِ الكنز!');},2200);
  later(()=>{state='done';document.getElementById('outro').hidden=false;},5200);}
function updateChest(dt){if(!chest.visible)return;const u=chest.userData;
  if(u.rise<1){u.rise=Math.min(1,u.rise+dt/1.6);const e=1-Math.pow(1-u.rise,3);chest.position.y=-0.45+0.45*e;chest.rotation.y=0.6+(1-e)*1.5;}
  if(u.open>0){u.open=Math.min(1,u.open+dt/1.1);const e=ease(u.open);lid.rotation.x=-1.9*e;u.glow.intensity=1.6*e;u.halo.material.opacity=0.7*e;}
  u.halo.material.rotation+=dt*0.5;}

/* ---------- 10. input: tap vs drag ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let down=null;
function pick(ev){const r=canvas.getBoundingClientRect();ndc.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(pickables,false);for(const h of hits){const o=h.object;if(!o.visible||!inGroupVisible(o))continue;if(o.userData.cut&&h.point.y>cutPlane.constant)continue;return h;}return null;}
function inGroupVisible(o){while(o){if(!o.visible)return false;o=o.parent;}return true;}
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};});
canvas.addEventListener('pointerup',e=>{if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y),dt=performance.now()-down.t;down=null;
  if(moved>10||dt>650||state==='intro'||state==='reveal')return;const h=pick(e);if(!h)return;
  if(h.object===floor){lastAct=performance.now();walkTo(h.point,null);return;}tapItem(h.object.userData.item,h.point);});
let hoverT=0;canvas.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||e.buttons)return;const n=performance.now();if(n-hoverT<80)return;hoverT=n;const h=pick(e);canvas.style.cursor=h&&h.object!==floor&&state!=='intro'?'pointer':'grab';});

/* ---------- 11. HUD buttons ---------- */
document.getElementById('btnStart').onclick=()=>{document.getElementById('intro').hidden=true;state='play';tones([[660,0,.15],[880,.1,.2]]);
  say('مرحباً روز! هيا نبحث عن ثلاث نجوم مخبأة في غرفتك. اضغطي على الأغراض!');roseWave=1.5;lastAct=performance.now();renderTray();};
document.getElementById('btnAgain').onclick=()=>{document.getElementById('outro').hidden=true;newGame();flyTo(startPose());state='play';say('لعبة جديدة! النجوم تخبأت في أماكن جديدة');lastAct=performance.now();};
document.getElementById('btnHint').onclick=()=>{if(state==='play')giveHint();else if(state==='intro')say('اضغطي على زر ابدئي المغامرة');};
document.getElementById('btnCam').onclick=()=>flyTo(state==='done'||state==='reveal'?chestPose():startPose());
const bs=document.getElementById('btnSound');bs.onclick=()=>{soundOn=!soundOn;bs.setAttribute('aria-pressed',soundOn);bs.setAttribute('aria-label',soundOn?'الصوت يعمل':'الصوت مكتوم');
  document.getElementById('waves').toggleAttribute('hidden',!soundOn);document.getElementById('mute').toggleAttribute('hidden',soundOn);if(!soundOn&&window.speechSynthesis)speechSynthesis.cancel();};

/* ---------- 12. loop ---------- */
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);
resize();newGame();flyTo(startPose(),true);roseWave=999;
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;const t=now/1000;
  if(state!=='intro'&&roseWave>100)roseWave=0;
  if(camTween){const k=Math.min(1,(now-camTween.t0)/1200),e=ease(k);controls.enabled=false;
    camera.position.lerpVectors(camTween.from.pos,camTween.to.pos,e);controls.target.lerpVectors(camTween.from.tgt,camTween.to.tgt,e);
    camera.fov=camTween.from.fov+(camTween.to.fov-camTween.from.fov)*e;camera.updateProjectionMatrix();if(k>=1){camTween=null;controls.enabled=true;}}
  controls.update();controls.target.clamp(TMIN,TMAX);
  updateCuts();updateRose(dt,t);updateFx(dt,now);updateStars(dt);updateChest(dt);updateConfetti(dt);
  if(state==='play'&&now-lastAct>16000)giveHint();
  const pa=pg.attributes.position.array,ts=now*0.0004;for(let i=0;i<pa.length;i+=3){pa[i+1]=base0[i+1]+Math.sin(ts+i)*0.08;pa[i]=base0[i]+Math.cos(ts*0.7+i)*0.05;}pg.attributes.position.needsUpdate=true;
  renderer.render(scene,camera);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.__game={ITEMS,tapItem,get state(){return state},get found(){return found},get clues(){return clues},start:()=>document.getElementById('btnStart').click()};
})();
</script>
